[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memoledger"
version = "0.1.0"
description = "Mobile-first memo extraction, stock ledger, and invoice generation for Bangladeshi businesses"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "minio>=7.2.5",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.0",
    "langgraph>=0.0.30",
    "langchain>=0.1.14",
    "langchain-core>=0.1.37",
    "langchain-google-genai>=1.0.1",
    "sentence-transformers>=2.5.1",
    "weasyprint>=61.2",
    "openpyxl>=3.1.2",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "playwright>=1.42.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

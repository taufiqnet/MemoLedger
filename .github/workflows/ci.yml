name: MemoLedger CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memoledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install system dependencies (WeasyPrint, OpenCV, Bengali fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libpango-1.0-0 \
          libharfbuzz0b \
          libpangoft2-1.0-0 \
          libcairo2 \
          libgdk-pixbuf-2.0-0 \
          libgl1 \
          libglib2.0-0 \
          fonts-noto-core \
          fonts-noto-extra \
          fonts-beng

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pytest pytest-asyncio httpx

    - name: Run Database Seeding
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/memoledger
        REDIS_URL: redis://localhost:6379/0
      run: |
        python scripts/init_db.py || true
        python scripts/seed_data.py

    - name: Run Gold & Synthetic Evaluation Suite (Regression Gates)
      run: |
        python evaluation/run_eval.py

    - name: Run Unit & Integration Test Suite
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/memoledger
      run: |
        python scripts/run_tests.py

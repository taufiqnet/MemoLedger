<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}MemoLedger - মেমোলেজার{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/static/css/output.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col pb-20 md:pb-0">

  <!-- Desktop & Tablet Header -->
  <header class="bg-teal-700 text-white shadow-md sticky top-0 z-50">
    <div class="container flex items-center justify-between py-3">
      <div class="flex items-center gap-3">
        <a href="/dashboard" class="flex items-center gap-2 font-bold text-xl tracking-tight">
          <span class="bg-teal-900 text-teal-200 px-2 py-1 rounded-md text-sm">ML</span>
          <span data-i18n="app_title">মেমোলেজার</span>
        </a>
      </div>

      <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
        <a href="/dashboard" class="hover:text-teal-200 transition-all" data-i18n="dashboard">ড্যাশবোর্ড</a>
        <a href="/upload" class="hover:text-teal-200 transition-all" data-i18n="upload">মেমো তুলুন</a>
        <a href="/stock" class="hover:text-teal-200 transition-all" data-i18n="stock_ledger">স্টক লেজার</a>
        <a href="/products" class="hover:text-teal-200 transition-all" data-i18n="products">পণ্য তালিকা</a>
        <a href="/suppliers" class="hover:text-teal-200 transition-all" data-i18n="suppliers">সরবরাহকারী</a>
        <a href="/ask-data" class="hover:text-teal-200 transition-all" data-i18n="ask_data">তথ্য জিজ্ঞাসা</a>
      </nav>

      <div class="flex items-center gap-3">
        <!-- Language Switcher -->
        <button id="lang-toggle-btn" class="bg-teal-800 hover:bg-teal-900 text-white text-xs px-3 py-1.5 rounded-full font-semibold transition-all">
          English
        </button>
      </div>
    </div>
  </header>

  <!-- Main Body Content -->
  <main class="container py-6 flex-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-50 flex items-center justify-around py-2">
    <a href="/dashboard" class="flex flex-col items-center text-xs text-slate-600 hover:text-teal-700">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span data-i18n="dashboard">ড্যাশবোর্ড</span>
    </a>
    <a href="/upload" class="flex flex-col items-center text-xs text-teal-700 font-bold">
      <div class="bg-teal-600 text-white p-2 rounded-full -mt-5 shadow-md">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </div>
      <span data-i18n="upload">মেমো তুলুন</span>
    </a>
    <a href="/stock" class="flex flex-col items-center text-xs text-slate-600 hover:text-teal-700">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
      <span data-i18n="stock_ledger">স্টক</span>
    </a>
    <a href="/ask-data" class="flex flex-col items-center text-xs text-slate-600 hover:text-teal-700">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
      <span data-i18n="ask_data">চ্যাট</span>
    </a>
  </nav>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js').catch(err => console.log('SW registration error:', err));
      });
    }
  </script>
  <script type="module" src="/static/js/i18n.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>

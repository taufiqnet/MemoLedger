services:
  api:
    build: .
    container_name: memoledger_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-19863022}@db:5432/${DB_NAME:-memoledger}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TZ: Asia/Dhaka
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./evaluation:/app/evaluation
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./data:/app/data
    command: >
      sh -c "python scripts/seed_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    image: postgres:16
    container_name: memoledger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-memoledger}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-19863022}
      TZ: Asia/Dhaka
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-memoledger}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: memoledger_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  postgres_data:
